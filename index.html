<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174c3e">
  <title>花東縱谷單車行程</title>
  <style>
    :root {
      color-scheme: light;
      --forest: #174c3e;
      --leaf: #d6ef73;
      --coral: #e76d4b;
      --ink: #1c2924;
      --muted: #62706a;
      --paper: #f5f7f1;
      --line: #dce3da;
      --white: #fff;
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

    .hero {
      min-height: 330px;
      display: flex;
      align-items: end;
      color: var(--white);
      background: linear-gradient(90deg, rgb(15 49 39 / 80%), rgb(15 49 39 / 8%)),
        linear-gradient(0deg, rgb(15 49 39 / 50%), transparent 62%),
        url("https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?auto=compress&cs=tinysrgb&w=1800") center 48% / cover;
    }

    .hero-inner, main { width: min(100% - 40px, 920px); margin-inline: auto; }
    .hero-inner { padding: 46px 0 34px; }
    .eyebrow { margin: 0 0 12px; color: var(--leaf); font-size: 13px; font-weight: 800; letter-spacing: .12em; }
    h1 { max-width: 700px; margin: 0; font-family: "Noto Serif TC", "PMingLiU", "Songti TC", serif; font-size: clamp(36px, 9vw, 66px); font-weight: 700; line-height: 1.18; }
    .hero-note { margin: 14px 0 0; color: rgb(255 255 255 / 84%); font-size: 15px; }

    main { padding: 28px 0 64px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .section-title { margin: 0; font-size: 22px; font-weight: 800; }
    .import-label { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 17px; border-radius: 6px; background: var(--forest); color: var(--white); font-size: 14px; font-weight: 750; cursor: pointer; transition: background .18s ease, transform .18s ease; }
    .import-label:hover { background: #22624f; transform: translateY(-1px); }
    .import-label svg { width: 18px; height: 18px; }
    #workbook-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }

    .file-status { min-height: 22px; margin: -8px 0 18px; color: var(--muted); font-size: 13px; }
    .sheet-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: thin; }
    .sheet-tab { flex: 0 0 auto; min-height: 40px; padding: 0 15px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; }
    .sheet-tab[aria-selected="true"] { border-color: var(--forest); background: var(--forest); color: white; }

    .search-wrap { position: relative; margin: 8px 0 18px; }
    .search-wrap svg { position: absolute; top: 50%; left: 15px; width: 18px; height: 18px; color: var(--muted); transform: translateY(-50%); pointer-events: none; }
    .search { width: 100%; min-height: 48px; padding: 0 16px 0 44px; border: 1px solid var(--line); border-radius: 5px; background: white; color: var(--ink); }
    .result-count { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .day-alert { display: grid; gap: 10px; margin: 0 0 16px; }
    .day-alert-card { padding: 16px 18px; border: 2px solid #c94324; border-left: 8px solid #c94324; border-radius: 6px; background: #fff2ec; box-shadow: 0 8px 20px rgb(67 35 22 / 9%); }
    .day-alert-heading { display: flex; align-items: flex-start; gap: 9px; margin: 0 0 7px; color: #8d2c16; font-size: clamp(18px, 2.7vw, 21px); font-weight: 900; line-height: 1.35; }
    .day-alert-mark { flex: 0 0 auto; padding: 2px 7px; border-radius: 3px; background: #c94324; color: #fff; font-size: 12px; font-weight: 900; letter-spacing: .08em; line-height: 1.5; }
    .day-alert-body { margin: 0; color: #55271b; font-size: 15px; font-weight: 700; line-height: 1.7; }
    .day-alert-links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 10px 0 0; padding: 0; list-style: none; }
    .day-alert-links a { color: #8d2c16; font-size: 14px; font-weight: 800; text-underline-offset: 3px; }
    .day-alert-meta { display: block; margin-top: 7px; color: #8b5a4a; font-size: 12px; font-weight: 650; }
    .entries { display: grid; gap: 10px; }
    .entry { display: grid; grid-template-columns: minmax(110px, .34fr) minmax(0, 1fr) auto; align-items: start; gap: 18px; padding: 18px 20px; border: 1px solid var(--line); border-left: 4px solid var(--leaf); border-radius: 5px; background: var(--white); animation: arrive .28s ease both; }
    .entry-heading { min-width: 0; }
    .entry-title { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.45; overflow-wrap: anywhere; }
    .entry-index { display: block; margin-bottom: 5px; color: var(--coral); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .entry-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px 18px; }
    .field { min-width: 0; }
    .field-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .field-value { display: block; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }
    .map-link { align-self: center; display: inline-flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 4px; background: #edf4e9; color: var(--forest); font-size: 12px; font-weight: 800; text-decoration: none; white-space: nowrap; }
    .map-link svg { width: 16px; height: 16px; }
    .map-options { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
    .map-options-label { flex: 0 0 100%; color: var(--muted); font-size: 11px; font-weight: 800; }
    .route-note { flex: 1 1 100%; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .map-link { min-height: 38px; white-space: normal; }
    .map-link svg { flex: 0 0 auto; }

    .empty { padding: 36px 20px; border: 1px dashed #b6c4b8; border-radius: 5px; text-align: center; }
    .empty-mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 50%; background: var(--leaf); color: var(--forest); }
    .empty-mark svg { width: 23px; height: 23px; }
    .empty h3 { margin: 0 0 8px; font-size: 18px; }
    .empty p { max-width: 420px; margin: 0 auto; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .privacy { margin: 18px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .error { color: #a83e2b !important; }
    [hidden] { display: none !important; }

    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 620px) {
      .hero { min-height: 290px; background-position: 58% center; }
      .hero-inner, main { width: min(100% - 28px, 920px); }
      .hero-inner { padding-bottom: 26px; }
      main { padding-top: 22px; }
      .toolbar { align-items: flex-start; }
      .section-title { padding-top: 8px; font-size: 19px; }
      .import-label { min-height: 42px; padding-inline: 12px; font-size: 13px; }
      .entry { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 15px; }
      .entry-heading { grid-column: 1 / -1; }
      .entry-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .map-link { grid-column: 1 / -1; justify-self: start; }
    }
    @media (max-width: 370px) {
      .entry-fields { grid-template-columns: 1fr; }
      .hero-inner, main { width: min(100% - 24px, 920px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

      ],

        { label: "縱關日月亭 → 武陵綠色隧道 → 鹿野龍田 → 小葉欖仁綠色隧道 → 台東市還車", origin: "縱關日月亭 957臺東縣海端鄉崁頂村", waypoints: ["武陵綠色隧道 955臺東縣鹿野鄉永安村永嶺路83號", "鹿野龍田自行車道 955臺東縣鹿野鄉光榮路", "小葉欖仁綠色隧道 955臺東縣鹿野鄉龍田村"], destination: "阿勝單車台東店 950臺東縣臺東市岩灣里新站路223號", stops: "縱關日月亭 → 武陵綠色隧道 → 鹿野龍田自行車道 → 小葉欖仁綠色隧道 → 阿勝單車台東店", note: "沿台 9 線南下；武陵綠色隧道自行車道 4.7 公里、鹿野龍田自行車道 7.2 公里另為該車道本身長度，已含在本段停留時間內。" },
      ]
    };

    const routeEntryTitles = {
      "1": ["阿勝租車 → 山下的厝：台9線（全程導航）"],
      "2": ["瑞穗－玉里", "玉里－富里", "富里－池上", "池上－關山"],
      "3": ["關山環鎮自行車道", "武陵－龍田－台東市"],
    };

    const dayAlerts = {
      "1": [
        {
          title: "台9線馬太鞍溪鋼便橋：施工通行，請減速",
          text: "馬太鞍溪橋復建中，鋼便橋目前可通行（限速 40）。行經 246K+574–247K+750 請減速，遇豪雨或工程管制可能封閉；出發前請查公路局即時路況。",
          links: [
            { label: "新聞：馬太鞍溪鋼便橋通車", url: "https://www.sjtv.com.tw/articles/101619?lang=en" },
            { label: "公路局即時路況", url: "https://168.thb.gov.tw" }
          ],
          meta: "資料查證：2026-11-03 · 目前非封閉"
        }
      ],
      "2": [
        {
          title: "玉富自行車道封閉（3K+100 至 9K+100）",
          text: "2026/6/8–12/31 封閉。行程 02 已改走花 75 卓富產業道路，不經此車道；若仍想騎玉富自行車道，只能到 3K+100 後原路折返玉里，東里鐵馬驛站無法經車道貫通。",
          links: [
            { label: "官方封閉公告", url: "https://www.erv-nsa.gov.tw/zh-tw/event/news/6078" }
          ],
          meta: "花東縱谷國家風景區管理處 · 2026-09-30 更新"
        }
      ],
      "3": [
        {
          title: "197縣道災後復建（30K+800、35K+800）",
          text: "樺加沙颱風災損路段復建工程仍在招標，龍田→台東市可能遇施工或管制。目前查無近期全段封閉新聞，但出發前務必查即時路況；如遇管制請改走台9線。",
          links: [
            { label: "復建工程招標資料", url: "https://twbuying.org/region/%E8%87%BA%E6%9D%B1%E7%B8%A3" },
            { label: "公路局即時路況", url: "https://168.thb.gov.tw" }
          ],
          meta: "政府採購資料 2026-09-22 · 尚無明確封閉公告"
        }
      ]
    };

    function renderDayAlert() {
      const alerts = dayAlerts[activeDay] || [];
      dayAlert.replaceChildren();
      if (!alerts.length) {
        dayAlert.hidden = true;
        return;
      }

      alerts.forEach(alert => {
        const card = document.createElement("section");
        card.className = "day-alert-card";
        const heading = document.createElement("h3");
        heading.className = "day-alert-heading";
        const mark = document.createElement("span");
        mark.className = "day-alert-mark";
        mark.textContent = "注意";
        const title = document.createElement("span");
        title.textContent = alert.title;
        heading.append(mark, title);

        const body = document.createElement("p");
        body.className = "day-alert-body";
        body.textContent = alert.text;
        card.append(heading, body);

        if (alert.links?.length) {
          const list = document.createElement("ul");
          list.className = "day-alert-links";
          alert.links.forEach(linkItem => {
            const item = document.createElement("li");
            const link = document.createElement("a");
            link.href = linkItem.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = linkItem.label;
            item.append(link);
            list.append(item);
          });
          card.append(list);
        }

        if (alert.meta) {
          const meta = document.createElement("span");
          meta.className = "day-alert-meta";
          meta.textContent = alert.meta;
          card.append(meta);
        }

        dayAlert.append(card);
      });
      dayAlert.hidden = false;
    }

    function renderDayTabs() {
      dayTabs.replaceChildren();
      const options = [
        { value: "1", label: "第 1 天" },
        { value: "2", label: "第 2 天" },
        { value: "3", label: "第 3 天" },
        { value: "other", label: "其他資訊" }
      ];
      options.forEach(({ value, label }) => {
        const button = document.createElement("button");
        button.className = "sheet-tab";
        button.type = "button";
        button.role = "tab";
        button.setAttribute("aria-selected", String(value === activeDay));
        button.textContent = label;
        button.addEventListener("click", () => {
          activeDay = value;
          renderDayTabs();
          renderDayAlert();
          renderEntries();
        });
        dayTabs.append(button);
      });
      dayTabs.hidden = false;
    }

    function renderEntries() {
      const query = search.value.trim().toLocaleLowerCase();
      const dayRows = itinerary.filter(item => item.day === activeDay);
      const filtered = dayRows.filter(item => [item.title, item.place, item.url, ...(item.fields || []).map(field => `${field.label} ${field.value}`)].join(" ").toLocaleLowerCase().includes(query));
      entries.replaceChildren();
      emptyState.hidden = filtered.length > 0;
      resultCount.textContent = query ? `找到 ${filtered.length} 筆行程` : `共 ${dayRows.length} 筆行程`;
      emptyTitle.textContent = "沒有符合的行程";
      emptyCopy.textContent = "換個地點、時間或關鍵字搜尋。";

      filtered.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "entry";

        const heading = document.createElement("div");
        heading.className = "entry-heading";
        const number = document.createElement("span");
        number.className = "entry-index";
        number.textContent = activeDay === "other" ? "旅程資訊" : `行程 ${String(index + 1).padStart(2, "0")}`;
        const titleNode = document.createElement("h3");
        titleNode.className = "entry-title";
        titleNode.textContent = item.title;
        heading.append(number, titleNode);

        const fields = document.createElement("div");
        fields.className = "entry-fields";
        (item.fields || []).forEach(fieldItem => {
          const field = document.createElement("div");
          field.className = "field";
          const label = document.createElement("span");
          label.className = "field-label";
          label.textContent = fieldItem.label;
          const value = document.createElement("span");
          value.className = "field-value";
          value.textContent = fieldItem.value;
          field.append(label, value);
          fields.append(field);
        });

        if (item.url) {
          const field = document.createElement("div");
          field.className = "field";
          const label = document.createElement("span");
          label.className = "field-label";
          label.textContent = "參考網址";
          const value = document.createElement("span");
          value.className = "field-value";
          const link = document.createElement("a");
          link.href = item.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = item.url;
          value.append(link);
          field.append(label, value);
          fields.append(field);
        }
        card.append(heading, fields);

        const routesForItem = (dailyRoutes[activeDay] || []).filter((_, routeIndex) => routeEntryTitles[activeDay]?.[routeIndex] === item.title);
        if (item.place || item.mapOptions?.length || routesForItem.length) {
          const mapOptions = document.createElement("div");
          mapOptions.className = "map-options";
          const mapLabel = document.createElement("span");
          mapLabel.className = "map-options-label";
          mapLabel.textContent = routesForItem.length ? "Google 地圖" : "地圖";
          mapOptions.append(mapLabel);

          const addMapLink = (labelText, query, ariaLabel, option = {}) => {
            const link = document.createElement("a");
            link.className = "map-link";
            if (option.url) {
              link.href = option.url;
            } else if (option.origin && option.destination) {
              const directions = new URLSearchParams({ api: "1", origin: option.origin, destination: option.destination, travelmode: option.travelmode || (option.waypoints ? "bicycling" : "driving") });
              if (option.waypoints?.length) directions.set("waypoints", option.waypoints.join("|"));
              link.href = `https://www.google.com/maps/dir/?${directions}`;
            } else {
              link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
            }
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.setAttribute("aria-label", ariaLabel);
            link.innerHTML = option.url || (option.origin && option.destination)
              ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h12M3 12h8m-8 6h12M17 3l4 4-4 4"/></svg>'
              : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>';
            const text = document.createElement("span");
            text.textContent = labelText;
            link.append(text);
            mapOptions.append(link);
          };

          routesForItem.forEach(route => {
            addMapLink(`導航：${route.label}`, "", `以 Google 地圖開啟${route.label}`, route);
            if (route.note) {
              const routeNote = document.createElement("p");
              routeNote.className = "route-note";
              routeNote.textContent = route.note;
              mapOptions.append(routeNote);
            }
          });
          if (item.place) addMapLink(item.title, item.place, `在地圖中開啟${item.title}`);
          (item.mapOptions || []).forEach(option => addMapLink(option.label, option.query, `在地圖中搜尋${option.label}`, option));
          card.append(mapOptions);
        }
        entries.append(card);
      });
    }

    renderDayTabs();
    renderDayAlert();
    renderEntries();
    search.addEventListener("input", renderEntries);
  </script>
